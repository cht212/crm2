<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso CRM HPD</title>
    <style>
        :root { font-family: Georgia, 'Times New Roman', serif; color: #18322b; background: #e9f2ed; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at top right, #bde3d2, transparent 38%), #e9f2ed; }
        main { width: min(420px, calc(100% - 32px)); padding: 34px; background: #fffdf8; border: 1px solid #c9ddd2; box-shadow: 0 20px 50px rgba(30, 71, 56, .14); }
        h1 { margin: 0 0 8px; font-size: 30px; }
        p { color: #61766d; margin: 0 0 26px; }
        label { display: block; margin: 16px 0 7px; font: 700 12px Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
        input { width: 100%; padding: 13px; border: 1px solid #c9ddd2; background: #f7fbf8; font-size: 16px; }
        .password-row { display: flex; align-items: center; gap: 8px; margin-top: 9px; font: 13px Arial, sans-serif; color: #61766d; }
        .password-row input { width: auto; }
        .password-row label { margin: 0; font: inherit; text-transform: none; letter-spacing: 0; }
        button { width: 100%; margin-top: 22px; padding: 13px; border: 0; background: #176b52; color: white; font-weight: 700; cursor: pointer; }
        #error { min-height: 20px; margin-top: 16px; color: #a63c35; font: 14px Arial, sans-serif; }
    </style>
</head>
<body>
    <main>
        <h1>CRM HPD</h1>
        <p>Ingresa para gestionar conversaciones y clientes.</p>
        <form id="loginForm">
            <label for="username">Usuario</label>
            <input id="username" autocomplete="username" required>
            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <div class="password-row">
                <input id="showPassword" type="checkbox">
                <label for="showPassword">Mostrar contraseña</label>
            </div>
            <button type="submit">Iniciar sesión</button>
        </form>
        <div id="error" role="alert"></div>
    </main>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async event => {
            event.preventDefault();
            const error = document.getElementById('error');
            error.textContent = '';
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({
                    usuario: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    recordarme: true
                })
            });
            if (response.ok) {
                window.location.href = '/';
                return;
            }
            if (response.status === 404) {
                error.textContent = 'El servidor activo no tiene el login instalado. Reinicia el CRM con la versión nueva.';
            } else if (response.status === 401) {
                error.textContent = 'Usuario o contraseña incorrectos.';
            } else {
                error.textContent = `No se pudo iniciar sesión (HTTP ${response.status}).`;
            }
        });
        document.getElementById('showPassword').addEventListener('change', event => {
            document.getElementById('password').type = event.target.checked ? 'text' : 'password';
        });
    </script>
</body>
</html>
