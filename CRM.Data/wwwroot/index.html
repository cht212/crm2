<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM HPD - WhatsApp</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div>
                <img class="hpd-header-logo" src="/iconodelog.png" alt="HPD Glass Group">
                <span class="header-caption">CRM · Centro de atención</span>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                <span id="status">Conectando...</span>
                <button id="logoutButton" class="logout-button" type="button">Cerrar sesión</button>
            </div>
        </header>
        <main class="main">
            <nav class="workspace-nav" aria-label="Navegacion del CRM">
                <div class="nav-brand">
                    <button id="navBrandMark" class="nav-brand-mark" type="button" title="Expandir menú" aria-label="Expandir menú">
                        <img src="/iconodelog.png" alt="HPD" class="brand-icon">
                        <img src="/logo-full.png" alt="HPD Glass Group" class="brand-full">
                    </button>
                    <button id="navToggle" class="nav-toggle" type="button" title="Contraer menú" aria-label="Contraer menú"><i data-lucide="panel-left-close"></i></button>
                </div>
                <div class="nav-top">
                    <button class="nav-item active" data-module="inbox" title="Bandeja"><i data-lucide="inbox"></i><span class="nav-label">Inbox</span></button>
                    <button class="nav-item" data-module="contactos" title="Contactos"><i data-lucide="contact-round"></i><span class="nav-label">Contactos</span></button>
                    <button class="nav-item" data-module="pipeline" title="Pipeline"><i data-lucide="kanban"></i><span class="nav-label">Pipeline</span></button>
                    <button class="nav-item" data-module="reportes" title="Reportes"><i data-lucide="chart-no-axes-combined"></i><span class="nav-label">Reportes</span></button>
                    <button id="usersNav" class="nav-item hidden" data-module="usuarios" title="Usuarios"><i data-lucide="users-round"></i><span class="nav-label">Usuarios</span></button>
                </div>
            </nav>
            <aside class="sidebar hidden">
                <div class="sidebar-header">
                    <div class="sidebar-heading">
                        <div class="sidebar-title">Conversaciones</div>
                        <div id="conversationCount" class="conversation-count">0 chats</div>
                    </div>
                    <input id="searchInput" class="search" type="text" placeholder="Buscar cliente...">
                    <div class="filters">
                        <button class="filter-button active" data-filter="all">Todas</button>
                        <button class="filter-button" data-filter="new">Nuevas</button>
                        <button class="filter-button" data-filter="open">Abiertas</button>
                    </div>
                </div>
                <div id="conversationList" class="conversation-list"></div>
            </aside>
            <section class="chat hidden">
                <div id="chatHeader" class="chat-header">
                    <div class="chat-name">Selecciona una conversacion</div>
                    <div class="chat-phone">-</div>
                </div>
                <div id="messages" class="messages">
                    <div class="empty">Selecciona una conversacion para ver los mensajes.</div>
                </div>
                <div id="attachmentPreview" class="attachment-preview" aria-live="polite">
                    <div id="attachmentThumb" class="attachment-thumb">&#128206;</div>
                    <div class="attachment-meta">
                        <div id="attachmentName" class="attachment-name">Sin archivo</div>
                        <div id="attachmentSize" class="attachment-size">0 KB</div>
                    </div>
                    <button id="removeAttachment" class="attachment-remove" type="button" aria-label="Quitar archivo">×</button>
                </div>
                <div class="composer">
                    <input id="fileInput" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.webp" hidden>
                    <button id="attachButton" class="attach-button" type="button" title="Adjuntar documento" disabled>&#128206;</button>
                    <span id="fileName" class="file-name"></span>
                    <input id="messageInput" class="message-input" type="text" placeholder="Escribir mensaje..." disabled>
                    <button id="sendButton" class="send-button" disabled>Enviar</button>
                </div>
            </section>
            <aside id="details" class="details hidden">
                <div class="details-title">Ficha del cliente</div>
                <div class="empty-detail">Selecciona una conversacion para ver sus datos y actividad.</div>
            </aside>
            <section id="moduleView" class="module-view hidden"></section>
        </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="Script.js"></script>
</body>
</html>
